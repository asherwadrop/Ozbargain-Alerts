name: Check OzBargain

on:
  schedule:
       - cron: "*/5 * * * *"    # every 5 minutes
  workflow_dispatch:          # adds a "Run workflow" button for testing
    inputs:
      send_test:
        description: "Send a test message to Discord"
        type: boolean
        default: true

permissions:
  contents: write             # lets it save seen.json

concurrency:
  group: check-deals

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Look for hot deals
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          SEND_TEST: ${{ inputs.send_test }}
        run: python3 check_deals.py

      - name: Remember which deals were already sent
        run: |
          git config user.name "deal-bot"
          git config user.email "deal-bot@users.noreply.github.com"
          git add seen.json
          git diff --cached --quiet || (git commit -m "Update seen deals" && git push)
